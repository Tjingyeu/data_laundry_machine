# Data Configuration
data:
  raw_txt_dir: "data/raw_txt"
  chunks_output: "data/chunks.json"
  train_output: "data/train.jsonl"
  test_output: "data/test.json"
  id_to_label_output: "data/id_to_label.json"
  lines_per_chunk: 5  # Target 4-6 range
  chunk_overlap: 0
  test_split: 0.1
  random_seed: 42

# Model Configuration
model:
  base_model: "Qwen/Qwen2.5-0.5B"
  model_dtype: "bfloat16"
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Training Configuration
training:
  output_dir: "models/lora"
  num_epochs: 10
  per_device_batch_size: 8
  learning_rate: 2e-4
  warmup_steps: 100
  max_seq_length: 512
  num_positives: 3
  num_negatives: 1
  gradient_accumulation_steps: 1
  logging_steps: 10
  save_steps: 100

# Inference Configuration
inference:
  lora_dir: "models/lora"
  top_k: 5
  relevance_threshold: 0.3

# Vector Search Configuration
vector_search:
  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_dim: 384
  index_type: "IndexFlatIP"
  batch_size: 32

# Evaluation Configuration
evaluation:
  k_values: [1, 3, 5]
